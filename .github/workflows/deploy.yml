name: Déploiement GitHub Pages

# Sur une pull request (Dependabot compris), la chaîne de vérification tourne sans publier.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - run: npx playwright install --with-deps chromium
      # Le parcours « recherche par image » sert les poids du modèle depuis ce cache (celui du workflow d'évaluation)
      # au lieu de les télécharger ; sans cache, il les prend sur le Hub.
      # Même liste de chemins que evaluation.yml : GitHub la fait entrer dans la version du cache, un chemin de moins et il est introuvable.
      - uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/@huggingface/transformers/.cache
            eval/images
          key: eval-${{ hashFiles('src/lib/ml/model.ts', 'eval/queries.json') }}
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: service/requirements.txt
      - run: pip install -r service/requirements.txt
      - run: python -m pytest service -q

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, service]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
